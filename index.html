<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Class 10 CBSE Maths Formula Hub — All important formulas at one place">
  <title>Class 10 Maths Formula Hub</title>
  <script>
    (function () {
      var t = localStorage.getItem("maths-hub-theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <a href="#/" class="logo-link">
          <span class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>
              <path d="M10 28V12h5l4 8.5L23 12h5v16h-3.5V19.5L19.5 28h-3L12 19.5V28H10z" fill="white"/>
              <defs>
                <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40">
                  <stop stop-color="#4f46e5"/>
                  <stop offset="1" stop-color="#0d9488"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="logo-text">Maths Hub</span>
        </a>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="progress-ring-wrap" id="sidebarProgress">
        <svg class="progress-ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="progress-ring-bg" cx="18" cy="18" r="15.9"/>
          <circle class="progress-ring-fill" id="progressRingFill" cx="18" cy="18" r="15.9"/>
        </svg>
        <span class="progress-ring-label" id="progressRingLabel">0/14</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#/" class="nav-link" data-route="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="#/important" class="nav-link" data-route="/important">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Most Important
        </a>
        <a href="#/revision" class="nav-link" data-route="/revision">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Last Minute Revision
        </a>
        <a href="#/quiz" class="nav-link" data-route="/quiz">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Formula Quiz
        </a>
        <a href="#/bookmarks" class="nav-link" data-route="/bookmarks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
          Bookmarks
        </a>
      </nav>

      <div class="sidebar-chapters">
        <p class="sidebar-section-title">Chapters</p>
        <div id="sidebarChapterList"></div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <div class="main-wrapper">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>

        <div class="search-wrap" id="searchWrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="search" id="globalSearch" class="search-input" placeholder="Search formulas, chapters..." autocomplete="off" aria-label="Search formulas">
          <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
        </div>

        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode" type="button">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </header>

      <main class="content" id="mainContent" tabindex="-1"></main>
    </div>
  </div>

  <button class="back-to-top" id="backToTop" aria-label="Back to top" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="js/data/chapters.js"></script>
  <script defer src="js/data/important.js"></script>
  <script defer src="js/data/quiz-data.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/copy.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/print.js"></script>
  <script defer src="js/quiz.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/router.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
